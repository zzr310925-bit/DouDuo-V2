name: Build unsigned IPA (Xcode 27)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
      - name: Download VLC playback framework
        run: ./scripts/fetch-vlckit.sh
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/DerivedData/Build/Products/Release-iphoneos/DouDuo.app
      - name: Package IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/DouDuo.app build/package/Payload/
          cd build/package && zip -qry ../DouDuo-unsigned.ipa Payload && cd ..
          shasum -a 256 DouDuo-unsigned.ipa | tee SHA256SUMS.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-unsigned
          path: |
            build/DouDuo-unsigned.ipa
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
